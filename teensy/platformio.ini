[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
extra_scripts = pre:microros_cflags.py

board_microros_transport = serial

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    PaulStoffregen/Time

board_microros_distro = jazzy

build_flags =
    -D TEENSY_DUAL_SERIAL
    -D_POSIX_TIMERS=0
    -O3

monitor_speed = 3000000
