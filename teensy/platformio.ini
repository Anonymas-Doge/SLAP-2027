[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
extra_scripts = pre:microros_cflags.py

board_microros_transport = serial

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    PaulStoffregen/Time
    https://github.com/mjbots/moteus-arduino.git
    https://github.com/pierremolinaro/acan2517FD.git
    adafruit/Adafruit BNO08x

board_microros_distro = jazzy

build_flags =
    -D TEENSY_DUAL_SERIAL
    -D_POSIX_TIMERS=0
    -O3
    -I include

monitor_speed = 3000000
